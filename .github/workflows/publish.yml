name: Publish to JSR

on:
  push:
    tags:
      - "v*.*.*" # Matches the same tags as npm-publish.yml, so npm and JSR ship together
  workflow_dispatch: # Manual re-run if a publish needs retrying

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # The OIDC ID token is used for authentication with JSR.
    steps:
      - uses: actions/checkout@v4
      - name: Publish with JSR
        id: publish_jsr
        run: npx jsr publish
